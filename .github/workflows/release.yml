name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as a prerelease
        type: boolean
        default: false
  push:
    tags:
      - "v*"

jobs:
  smoke:
    name: GPUI Gate
    uses: ./.github/workflows/gpui-check.yml

  gpui-binaries:
    name: GPUI binary (${{ matrix.name }})
    needs: smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: ""
            bin: 2code
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bin: 2code
          - name: windows-x64
            os: windows-latest
            target: ""
            bin: 2code.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libsqlite3-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      - name: Setup Rust
        if: matrix.target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust with target
        if: matrix.target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          workspaces: |
            src-gpui -> target

      - name: Build GPUI app
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --manifest-path src-gpui/Cargo.toml --target "${{ matrix.target }}"
            echo "GPUI_BIN=src-gpui/target/${{ matrix.target }}/release/${{ matrix.bin }}" >> "$GITHUB_ENV"
          else
            cargo build --release --manifest-path src-gpui/Cargo.toml
            echo "GPUI_BIN=src-gpui/target/release/${{ matrix.bin }}" >> "$GITHUB_ENV"
          fi

      - name: Upload GPUI binary
        uses: actions/upload-artifact@v4
        with:
          name: 2code-gpui-${{ matrix.name }}
          path: ${{ env.GPUI_BIN }}
          if-no-files-found: error

  publish:
    name: Legacy Tauri publish (${{ matrix.name }})
    needs: smoke
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build macOS packages on native CPU runners so app architectures stay aligned.
          - name: macOS arm64
            platform: macos-15
            rustTargets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS x64
            platform: macos-15-intel
            rustTargets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux x64
            platform: ubuntu-24.04
            rustTargets: ""
            args: ""
          - name: Windows x64
            platform: windows-latest
            rustTargets: ""
            args: --bundles nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            just \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install just (macOS)
        if: runner.os == 'macOS'
        run: brew install just

      - name: Install just (Windows)
        if: runner.os == 'Windows'
        run: choco install just -y

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          workspaces: |
            src-tauri -> target

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Install Apple Developer ID G2 certificate
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning

      - name: Prepare Apple notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/appstoreconnect/private_keys"
          key_path="$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tauriScript: bun tauri
          tagName: v__VERSION__
          releaseName: 2code v__VERSION__
          releaseBody: See the assets to download this version and install.
          releaseDraft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          includeUpdaterJson: true
          retryAttempts: 2
          args: ${{ matrix.args }}
