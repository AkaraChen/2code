name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as a prerelease
        type: boolean
        default: false
  push:
    tags:
      - "v*"

jobs:
  smoke:
    name: Linux Smoke Gate
    uses: ./.github/workflows/tauri-smoke.yml

  publish:
    name: Publish (${{ matrix.name }})
    needs: smoke
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos-15
            rustTargets: aarch64-apple-darwin
            targetDir: aarch64-apple-darwin
            asset: 2code-macos-arm64
            binary: 2code
          - name: macOS x64
            platform: macos-15-intel
            rustTargets: x86_64-apple-darwin
            targetDir: x86_64-apple-darwin
            asset: 2code-macos-x64
            binary: 2code
          - name: Linux x64
            platform: ubuntu-24.04
            rustTargets: ""
            targetDir: ""
            asset: 2code-linux-x64
            binary: 2code
          - name: Windows x64
            platform: windows-latest
            rustTargets: ""
            targetDir: ""
            asset: 2code-windows-x64.exe
            binary: 2code.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            just \
            libssl-dev \
            libsqlite3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev \
            libfontconfig-dev \
            libfreetype-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          workspaces: |
            src-tauri -> target

      - name: Build native GPUI binary
        shell: bash
        run: |
          if [ -n "${{ matrix.rustTargets }}" ]; then
            cargo build -p gpui-app --release --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rustTargets }}
          else
            cargo build -p gpui-app --release --manifest-path src-tauri/Cargo.toml
          fi

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          if [ -n "${{ matrix.targetDir }}" ]; then
            src="src-tauri/target/${{ matrix.targetDir }}/release/${{ matrix.binary }}"
          else
            src="src-tauri/target/release/${{ matrix.binary }}"
          fi
          cp "$src" "dist/${{ matrix.asset }}"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
          name: 2code ${{ github.ref_name }}
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
