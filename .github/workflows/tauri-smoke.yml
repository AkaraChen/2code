name: Desktop Smoke

on:
  workflow_call:
  push:
    branches:
      - dev
      - "codex/**"
  pull_request:
    branches:
      - dev

jobs:
  smoke:
    name: Native GPUI
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            curl \
            file \
            just \
            libssl-dev \
            libsqlite3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev \
            libfontconfig-dev \
            libfreetype-dev \
            mesa-vulkan-drivers \
            xvfb

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          workspaces: |
            src-tauri -> target

      - name: Test native GPUI crate
        run: cargo test -p gpui-app --manifest-path src-tauri/Cargo.toml

      - name: Build native 2code binary
        run: cargo build -p gpui-app --manifest-path src-tauri/Cargo.toml

      - name: Launch GPUI window under xvfb
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          xvfb-run -a timeout 8 src-tauri/target/debug/2code || test $? -eq 124
