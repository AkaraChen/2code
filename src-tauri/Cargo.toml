[workspace]
members = [ "crates/*" ]

[package]
name = "code"
description = "2code desktop application"
authors = [ "you" ]
edition = "2021"
default-run = "code"

[features]
default = []
# Build the old Tauri/React webview instead of the native GPUI app.
legacy-tauri = [
	"dep:tauri",
	"dep:tauri-plugin-opener",
	"dep:tauri-plugin-dialog",
	"dep:tauri-plugin-notification",
	"dep:tauri-plugin-store",
	"dep:tauri-plugin-shell",
	"dep:tauri-plugin-clipboard-manager",
	"dep:tauri-plugin-process",
	"dep:tauri-plugin-updater",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "code_lib"
crate-type = [ "staticlib", "cdylib", "rlib" ]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
# Workspace crates
model = { path = "crates/model" }
repo = { path = "crates/repo" }
infra = { path = "crates/infra" }
service = { path = "crates/service" }
gpui-app = { path = "crates/gpui-app" }

# Tauri framework (only for --features legacy-tauri)
tauri = { version = "2", optional = true, features = ["protocol-asset"] }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-store = { version = "2", optional = true }
tauri-plugin-shell = { version = "2.3.5", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }

# App-layer only dependencies
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = [ "json", "rustls" ] }
url = "2"
tracing = "0.1"
tracing-chrome = "0.7"
tracing-subscriber = { version = "0.3", features = [ "env-filter" ] }
tokio = { version = "1", features = [ "sync" ] }
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
tauri-plugin-process = { version = "2", optional = true }
[target.'cfg(target_os = "macos")'.dependencies]
core-text = "22"

[target.'cfg(not(target_os = "macos"))'.dependencies]
fontdb = "0.23"

[target.'cfg(target_os = "windows")'.dependencies]
libsqlite3-sys = { version = "0.37", features = ["bundled"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }

[dev-dependencies]
diesel = { version = "2", features = ["sqlite"] }
diesel_migrations = "2"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
