[package]
name = "code-gpui"
version = "3.0.1"
edition = "2021"
description = "2code desktop app rewritten in GPUI"
authors = ["AkaraChen"]

[[bin]]
name = "2code"
path = "src/main.rs"

[dependencies]
model = { path = "../src-tauri/crates/model" }
repo = { path = "../src-tauri/crates/repo" }
infra = { path = "../src-tauri/crates/infra" }
service = { path = "../src-tauri/crates/service" }

gpui = "0.2.2"
gpui-component = "0.5.1"
diesel = { version = "2", features = ["sqlite"] }
anyhow = "1"
dirs = "6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vt100 = "0.16"
uuid = { version = "1", features = ["v4"] }
open = "5"
ureq = { version = "2", features = ["json"] }
fontdb = "0.23"

[target.'cfg(target_os = "windows")'.dependencies]
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
